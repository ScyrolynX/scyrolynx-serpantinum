[General]
# Paths: absolute (/usr/share/...) or relative to the theme folder. The "sddm" user must be able to read them.
wallpaper=assets/images/wallpaper.jpg
# Folder scanned for wallpapers (jpg/png/webp/bmp). Empty = assets/images. Can also be changed live in
# Customize -> Wallpaper (that choice is saved in settings_path and wins over this value).
wallpaper_dir=
avatar=
welcome_text=Hi Dev-Scyrolynx
brand_text=SCYROLYNX
clock_24h=true
fingerprint_enabled=true
# Live CPU/RAM/temp/battery/uptime cards. Needs QML_XHR_ALLOW_FILE_READ=1 in the greeter (docs/AUTHENTICATION.md).
telemetry=true
# Set true on weak GPUs / software rendering: skips the blur effect
disable_blur=false
font_family=JetBrains Mono
font_ui=Inter
# Where in-greeter customization (layout, wallpaper, colours, notes) is stored. Must be writable by user "sddm".
settings_path=/var/lib/sddm/.config/scyrolynx-serpantinum.conf
