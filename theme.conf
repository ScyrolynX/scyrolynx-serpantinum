[General]
# Paths: absolute (/usr/share/...) or relative to the theme folder.
# The "sddm" user must be able to read the file.
wallpaper=assets/images/wallpaper.jpg
avatar=
welcome_text=Hi Dev-Scyrolynx
brand_text=SCYROLYNX
clock_24h=true
show_power=true
fingerprint_enabled=true
# Set true on weak GPUs / software rendering: skips the blur effect
disable_blur=false
font_family=Nunito
# Where in-greeter customization (drag/colours/blur) is stored. Must be writable by user "sddm".
settings_path=/var/lib/sddm/.config/scyrolynx-serpantinum.conf
